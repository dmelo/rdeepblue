name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (pins pnpm via packageManager field)
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # `build` runs `tsc` (strict typecheck gate) then `vite build`.
      - name: Typecheck & build
        run: corepack pnpm build

      - name: Test
        run: corepack pnpm test
